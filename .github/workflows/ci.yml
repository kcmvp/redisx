name: ci-gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Step 1: Check go mod tidiness
  go-mod:
    name: Go Mod Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'

    - name: Check go mod
      run: |
        go mod tidy -diff >/dev/null || (go mod tidy && git diff --exit-code go.mod go.sum) || (echo "go.mod or go.sum is not tidied" && exit 1)

  # Step 2: Run tests (depends on go-mod passing)
  test:
    name: Tests
    needs: go-mod
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        go-version: ['1.26.5', '1.27.0']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -tags testonly -v -race -coverprofile=coverage.txt ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: kcmvp/redisx

  # Step 3: Build and lint (depends on test passing)
  build:
    name: Build & Lint
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Architecture rule — client (non-test) must NOT import server
      run: |
        set -euo pipefail

        echo "--- (1) Direct source import audit: no redisx/server, buntdb, or client→server in core SDK packages (x, client, client/doc); excluding *_test.go ---"
        DIRECT_FORBIDDEN=$(
          ( grep -RIlsE '"github.com/kcmvp/redisx/server"|"github.com/tidwall/buntdb"' x/ client/ client/doc/ 2>/dev/null || true ) \
            | grep -v '_test.go$' || true
        )
        if [ -n "$DIRECT_FORBIDDEN" ]; then
          echo "ERROR: x/ or client/ non-test files directly import redisx/server or buntdb — forbidden."
          echo "$DIRECT_FORBIDDEN"
          exit 1
        fi
        echo "OK: no direct import of redisx/server or buntdb in x/client/client-doc non-test files."

        echo "--- (2) Transitive dep audit: ./x ./client ./client/doc non-test graphs must NOT pull server or buntdb ---"
        for pkg in ./x ./client ./client/doc; do
          echo "Checking transitive deps of $pkg (non-test)..."
          SERVER_DEPS=$(go list -tags testonly -f '{{join .Deps "\n"}}' "$pkg" | { grep -E '^github\.com/kcmvp/redisx/server($|/)' || true; })
          if [ -n "$SERVER_DEPS" ]; then
            echo "ERROR: $pkg transitively depends on redisx/server — forbidden."
            echo "$SERVER_DEPS"
            exit 1
          fi
          BUNTDB_DEPS=$(go list -tags testonly -f '{{join .Deps "\n"}}' "$pkg" | { grep -E '^github\.com/tidwall/buntdb($|/)' || true; })
          if [ -n "$BUNTDB_DEPS" ]; then
            echo "ERROR: $pkg transitively depends on buntdb — storage engine leaked into SDK/API layer."
            echo "$BUNTDB_DEPS"
            exit 1
          fi
        done
        echo "OK: x + client + client-doc non-test transitive deps free of redisx/server and buntdb."

        echo "--- (3) Reverse direction sanity: server (non-test) must NOT depend on client ---"
        REVERSE_CLIENT=$(go list -tags testonly -f '{{join .Deps "\n"}}' ./server | { grep -E '^github\.com/kcmvp/redisx/client($|/)' || true; })
        if [ -n "$REVERSE_CLIENT" ]; then
          echo "ERROR: ./server transitively depends on redisx/client — dependency direction reversed (must be client→x←server, never server→client)."
          echo "$REVERSE_CLIENT"
          exit 1
        fi
        echo "OK: ./server (non-test) does not depend on client."

        echo "--- (4) cmd boundary — non-test files must NOT import redisx/client or redisx/server (two explicit allowlist exceptions) ---"
        echo "    (allowlist A) cmd/_shared/harness/harness.go may import redisx/server (it IS the integration test harness)"
        echo "    (allowlist B) cmd/*/internal/demo/main.go may import redisx/server (it IS the demo server-start entry)"
        CMD_CLIENT=$(
          ( grep -RIlsE '"github.com/kcmvp/redisx/client' cmd/ 2>/dev/null || true ) \
            | grep -v '_test.go$' || true
        )
        if [ -n "$CMD_CLIENT" ]; then
          echo "ERROR: cmd/ non-test files import redisx/client — cmd/ must reach server via raw RESP wire (cmd/_shared/session), not the Go SDK."
          echo "$CMD_CLIENT"
          exit 1
        fi
        echo "OK: cmd/ non-test files do NOT import redisx/client (raw RESP wire only)."
        CMD_SERVER=$(
          ( grep -RIlsE '"github.com/kcmvp/redisx/server' cmd/ 2>/dev/null || true ) \
            | grep -v '_test.go$' \
            | grep -v 'cmd/_shared/harness/harness\.go$' \
            | grep -v 'cmd/.*/internal/demo/main\.go$' || true
        )
        if [ -n "$CMD_SERVER" ]; then
          echo "ERROR: cmd/ non-test files import redisx/server (outside the harness/demo allowlist) — forbidden."
          echo "       Allowlist: cmd/_shared/harness/harness.go (tests only) + cmd/*/internal/demo/main.go (demo server entry)."
          echo "$CMD_SERVER"
          exit 1
        fi
        echo "OK: cmd/ non-test server imports restricted to harness.go + demo/main.go allowlist."

        echo "--- (5) harness boundary — cmd/_shared/harness/harness.go must ONLY be imported by *_test.go ---"
        HARNESS_IMPORTERS=$(
          ( grep -RIlsE 'cmd/_shared/harness"|_shared/harness"' cmd/ server/ client/ x/ internal/ ingest/ 2>/dev/null || true ) \
            | grep -v '_test.go$' \
            | grep -v 'cmd/_shared/harness/harness\.go$' || true
        )
        if [ -n "$HARNESS_IMPORTERS" ]; then
          echo "ERROR: non-_test.go files import the test-only cmd/_shared/harness package — forbidden."
          echo "       Only *_test.go files (integration tests) may reference the test harness."
          echo "$HARNESS_IMPORTERS"
          exit 1
        fi
        echo "OK: cmd/_shared/harness is only imported by *_test.go files (plus itself)."

    - name: Build
      run: go build -tags testonly -v ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=5m --output.text.path=stdout

    - name: Vet
      run: go vet -tags testonly ./...

  # Summary job (depends on all previous jobs)
  ci-success:
    name: CI Success
    needs: [go-mod, test, build]
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: CI passed
      run: echo "✅ All CI checks passed!"
