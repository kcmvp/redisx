coverage:
  status:
    patch:
      default:
        target: 60%
        threshold: 1%
        if_not_found: success
        if_ci_failed: error
    project:
      default:
        target: 70%
        threshold: 1%
        if_not_found: success

ignore:
  - "internal/testutil/**"
  - "**/vendor/**"
